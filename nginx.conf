server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames under /assets, safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Always revalidate the entry point so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Traefik sends /api to the api container. When that container is down,
    # Traefik drops its routes and /api lands here: answer with an error, not
    # the app's index.html with a 200.
    location /api/ {
        default_type application/json;
        return 503 '{"detail":"The API is unavailable"}';
    }

    # SPA fallback: let BrowserRouter handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
