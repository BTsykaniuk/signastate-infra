# Volumes are prefixed with the project name (signestate_api-data,
# signestate_letsencrypt), so renaming it starts from empty data and new certs.
name: signestate

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # HTTP only answers Let's Encrypt challenges and redirects everything else to HTTPS.
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      # Let's Encrypt via the HTTP-01 challenge (needs port 80 reachable from the internet).
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # Dashboard on http://localhost:${DASHBOARD_PORT} (bound to 127.0.0.1 below).
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  web:
    build:
      # The parent folder, so the build sees both ../signestate and this folder.
      context: ..
      dockerfile: infra/Dockerfile
      target: web
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${APP_DOMAIN:-localhost}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=80
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    volumes:
      - api-data:/app/data
    labels:
      - traefik.enable=true
      # Same as the Vite dev proxy: /api/* -> api:3001/* with the prefix stripped.
      - traefik.http.routers.api.rule=Host(`${APP_DOMAIN:-localhost}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.routers.api.middlewares=api-strip
      - traefik.http.middlewares.api-strip.stripprefix.prefixes=/api
      # Its own domain: https://${API_DOMAIN}/* -> api:3001/*. The strip is a
      # no-op for other paths and keeps the /api/uploads/<name> URLs the mock
      # returns working here too.
      - traefik.http.routers.api-domain.rule=Host(`${API_DOMAIN:-api-qa.elitekosova.com}`)
      - traefik.http.routers.api-domain.entrypoints=websecure
      - traefik.http.routers.api-domain.tls.certresolver=le
      - traefik.http.routers.api-domain.middlewares=api-strip
      - traefik.http.routers.api-domain.service=api
      - traefik.http.services.api.loadbalancer.server.port=3001
    restart: unless-stopped

volumes:
  # Holds db.json and uploaded images. `docker compose down -v` resets it to the seed data.
  api-data:
  # Issued certificates (acme.json). Keep it to avoid hitting Let's Encrypt rate limits.
  letsencrypt:
