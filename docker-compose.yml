# Volumes are prefixed with the project name (signestate_api-data,
# signestate_postgres-data, signestate_letsencrypt), so renaming it starts from
# empty data and new certs.
name: signestate

# The app repos are cloned inside this folder (git-ignored here):
#   git clone git@github.com:BTsykaniuk/signestate.git
#   git clone git@github.com:BTsykaniuk/signastate-be.git
# Somewhere else? Point FE_DIR / BE_DIR in .env at them, relative to this folder.

# Shared by the backend and its one-shot migrate job: same image, same settings
# (app/backend/core/config.py in the be repo validates them on import, alembic included).
x-backend: &backend
  build:
    context: ${BE_DIR:-./signastate-be}
    dockerfile: Dockerfile.backend
  environment:
    ENV: ${BE_ENV:-stage}
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: ${DB_USER:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    DB_NAME: ${DB_NAME:-signestate}
    # Defaults to the frontend's own domain. Set CORS_ORIGINS in .env to replace it.
    CORS_ORIGINS: '${CORS_ORIGINS:-["https://${APP_DOMAIN:-localhost}"]}'
    DOCS_USERNAME: ${DOCS_USERNAME:-signestate}
    DOCS_PASSWORD: ${DOCS_PASSWORD:?Set DOCS_PASSWORD in .env}
    # Trust Traefik's X-Forwarded-* headers (the container is only reachable
    # through it), so uvicorn sees https and builds redirects with it.
    FORWARDED_ALLOW_IPS: "*"

services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # HTTP only answers Let's Encrypt challenges and redirects everything else to HTTPS.
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      # Let's Encrypt via the HTTP-01 challenge (needs port 80 reachable from the internet).
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # Dashboard on http://localhost:${DASHBOARD_PORT} (bound to 127.0.0.1 below).
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  # ── Frontend (signestate repo) ──────────────────────────────────────────────

  web:
    build:
      # This folder for nginx.conf; the frontend repo as the `signestate` context.
      context: .
      additional_contexts:
        signestate: ${FE_DIR:-./signestate}
      target: web
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${APP_DOMAIN:-localhost}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=80
    restart: unless-stopped

  # The json-server mock (server.js in the signestate repo) the frontend still calls.
  api:
    build:
      context: .
      additional_contexts:
        signestate: ${FE_DIR:-./signestate}
      target: api
    volumes:
      - api-data:/app/data
    labels:
      - traefik.enable=true
      # Same as the Vite dev proxy: /api/* -> api:3001/* with the prefix stripped.
      - traefik.http.routers.api.rule=Host(`${APP_DOMAIN:-localhost}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.routers.api.middlewares=api-strip
      - traefik.http.middlewares.api-strip.stripprefix.prefixes=/api
      - traefik.http.services.api.loadbalancer.server.port=3001
    restart: unless-stopped

  # ── Backend (signastate-be repo) ────────────────────────────────────────────

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-signestate}
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applies pending migrations and exits; the backend starts only if it succeeds.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    # The image's HEALTHCHECK probes the API, which this container never serves.
    healthcheck:
      disable: true
    restart: "no"

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      # The whole domain: https://${API_DOMAIN}/api/v1/..., /docs, /redoc.
      - traefik.http.routers.backend.rule=Host(`${API_DOMAIN:-api-qa.elitekosova.com}`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=le
      - traefik.http.services.backend.loadbalancer.server.port=8080
    restart: unless-stopped

volumes:
  # Holds db.json and uploaded images. `docker compose down -v` resets it to the seed data.
  api-data:
  # The backend's database. `docker compose down -v` deletes it.
  postgres-data:
  # Issued certificates (acme.json). Keep it to avoid hitting Let's Encrypt rate limits.
  letsencrypt:
